[package]
name = "ytm-importer"
version = "0.1.0"
edition = "2021"
description = "Import Spotify playlists to YouTube Music"
authors = ["Francisco Belmar"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/fbelmart/ytm-importer"
keywords = ["youtube", "music", "spotify", "playlist", "import"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.2"
tempfile = "3.6"  # For tests
indicatif = "0.18.3"

[dev-dependencies]
tempfile = "3.6"

[[bin]]
name = "ytm-importer"
path = "src/main.rs"
